<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#185fa5;--bg:#f5f6fa;--surface:#fff;--border:#e8eaf0;--text:#1a1a2e;--text2:#5a5a7a;--text3:#9a9ab0;--green:#2d8a4e;--green-bg:#e8f5ed;--amber:#c47c0a;--amber-bg:#fef3d7;--red:#c0392b;--red-bg:#fdecea;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.07)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:15px;font-weight:700}
.content{max-width:900px;margin:0 auto;padding:20px 16px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(min-width:600px){.metrics{grid-template-columns:repeat(4,1fr)}}
.metric{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.metric-val{font-size:22px;font-weight:700;color:var(--text)}
.metric-lbl{font-size:11px;color:var(--text3);margin-top:3px}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.b-green{background:var(--green-bg);color:var(--green)}
.b-blue{background:#e6f1fb;color:#185fa5}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:#f1f2f6;color:#5a5a7a}
.b-purple{background:#f0eeff;color:#5b3fd4}
select,input{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text);font-family:inherit}
select:focus,input:focus{outline:none;border-color:var(--primary)}
/* Order cards */
.order-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;transition:box-shadow .15s}
.order-card:hover{box-shadow:var(--shadow)}
.order-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.order-num{font-size:13px;font-weight:700;font-family:monospace}
.order-customer{font-size:13px;font-weight:600;margin-bottom:2px}
.order-meta{font-size:12px;color:var(--text3)}
.order-items{background:var(--bg);border-radius:8px;padding:10px;margin:8px 0;font-size:12px;color:var(--text2)}
.order-item-row{display:flex;justify-content:space-between;padding:3px 0}
.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text);transition:all .1s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{opacity:.85;background:var(--primary)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-green{color:var(--green);border-color:var(--green)}
.btn-green:hover{background:var(--green-bg)}
.btn-red{color:var(--red);border-color:var(--red)}
.btn-red:hover{background:var(--red-bg)}
.slip-img{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-top:8px;border:1px solid var(--border)}
/* Plan banner */
.plan-banner{border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.plan-normal{background:var(--bg);border:1px solid var(--border)}
.plan-pro{background:linear-gradient(135deg,#1a1a2e,#3a1a6e);color:#fff}
.plan-pro .plan-label{color:rgba(255,255,255,.7)}
/* Reminder btn */
.reminder-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;background:var(--amber-bg);color:var(--amber);border:1px solid #f5d87a;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.reminder-btn:hover{background:#fde8a0}
/* Loading */
.loading{text-align:center;padding:40px;color:var(--text3)}
.spinner{display:inline-block;width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}
.locked{background:var(--red-bg);border:1px solid #f5a89a;border-radius:var(--radius);padding:20px;margin-bottom:16px;color:var(--red)}
</style>
</head>
<body>
<div id="toast"></div>
<div class="topbar">
  <div class="logo">OrderBase</div>
  <div id="top-right" style="font-size:13px;color:var(--text2)"></div>
</div>
<div class="content" id="main">
  <div class="loading"><div class="spinner"></div><div>Loading dashboard...</div></div>
</div>

<script>
const { createClient } = supabase;
const SUPABASE_URL = 'https://tnuedzooieppwutpmwqc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRudWVkem9vaWVwcHd1dHBtd3FjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MzY0NTgsImV4cCI6MjA5NTIxMjQ1OH0.ZhExMmLR29iilvOBTnjTFOHFV3MFl_NmdAXkt12rtSY';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let CLIENT=null, allOrders=[];

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function fmt(n){return 'LKR '+(n||0).toLocaleString();}
function fmtDate(d){return d?new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';}

function statusBadge(s){
  const m={Pending:'b-amber',Preparing:'b-blue',Ready:'b-purple',Delivered:'b-green',Cancelled:'b-red'};
  return `<span class="badge ${m[s]||'b-gray'}">${s}</span>`;
}
function payStatusBadge(s){
  const m={'Pending':'b-gray','Slip Uploaded':'b-amber','Verified':'b-green','Rejected':'b-red'};
  return `<span class="badge ${m[s]||'b-gray'}">💳 ${s}</span>`;
}

async function init(){
  const params=new URLSearchParams(location.search);
  const fk=params.get('client');
  if(!fk){showErr('No dashboard link');return;}
  const {data:client,error}=await sb.from('clients').select('*').eq('form_key',fk).single();
  if(error||!client){showErr('Not found');return;}
  CLIENT=client;
  document.title=client.name+' Dashboard';
  document.getElementById('top-right').innerHTML=`<strong>${client.name}</strong>`;
  if(client.status==='Past Due'||client.status==='Cancelled'){
    document.getElementById('main').innerHTML=`<div class="locked"><div style="font-size:16px;font-weight:700;margin-bottom:6px">🔒 Account ${client.status}</div><div>Contact your administrator to restore access.</div></div>`;return;
  }
  const {data:orders}=await sb.from('orders').select('*').eq('client_id',client.id).order('created_at',{ascending:false});
  allOrders=orders||[];
  render();
}

function render(){
  const color=CLIENT.branding_color||'#185fa5';
  const isPro=CLIENT.plan_type==='pro';
  const total=allOrders.length;
  const pending=allOrders.filter(o=>o.status==='Pending').length;
  const preparing=allOrders.filter(o=>o.status==='Preparing').length;
  const delivered=allOrders.filter(o=>o.status==='Delivered').length;
  const revenue=allOrders.filter(o=>o.status==='Delivered').reduce((a,o)=>a+(o.subtotal||0),0);
  const thisMonth=allOrders.filter(o=>new Date(o.created_at).getMonth()===new Date().getMonth()).length;
  const slipsPending=allOrders.filter(o=>o.payment_status==='Slip Uploaded').length;

  document.getElementById('main').innerHTML=`
    <div class="plan-banner ${isPro?'plan-pro':'plan-normal'}">
      <div>
        <div style="font-size:11px;font-weight:600;${isPro?'color:rgba(255,255,255,.6)':'color:var(--text3)'};text-transform:uppercase;letter-spacing:.05em">Current plan</div>
        <div style="font-size:16px;font-weight:700;margin-top:2px">${isPro?'⭐ Pro Plan':'Normal Plan'}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;${isPro?'color:rgba(255,255,255,.6)':'color:var(--text3)'}">Orders this month</div>
        <div style="font-size:15px;font-weight:700">${thisMonth} / ${CLIENT.max_orders||100}</div>
      </div>
    </div>
    ${slipsPending>0?`<div style="background:var(--amber-bg);border:1px solid #f5d87a;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;color:var(--amber);font-weight:500">⚠️ ${slipsPending} bank slip(s) waiting for payment verification</div>`:''}
    <div class="metrics">
      <div class="metric"><div class="metric-val">${total}</div><div class="metric-lbl">Total orders</div></div>
      <div class="metric"><div class="metric-val" style="color:var(--amber)">${pending}</div><div class="metric-lbl">Pending</div></div>
      <div class="metric"><div class="metric-val" style="color:var(--green)">${delivered}</div><div class="metric-lbl">Delivered</div></div>
      <div class="metric"><div class="metric-val" style="font-size:16px;color:${color}">${fmt(revenue)}</div><div class="metric-lbl">Revenue</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">Orders</div>
        <div style="display:flex;gap:8px">
          <select id="status-filter" onchange="filterOrders()">
            <option value="">All statuses</option>
            <option>Pending</option><option>Preparing</option><option>Ready</option><option>Delivered</option><option>Cancelled</option>
          </select>
          <select id="pay-filter" onchange="filterOrders()">
            <option value="">All payments</option>
            <option>Pending</option><option>Slip Uploaded</option><option>Verified</option>
          </select>
        </div>
      </div>
      <div id="orders-list">${renderOrders(allOrders)}</div>
    </div>
  `;
}

function renderOrders(orders){
  if(!orders.length)return'<div style="text-align:center;padding:30px;color:var(--text3)">No orders yet</div>';
  return orders.map(o=>{
    const items=o.items?JSON.parse(JSON.stringify(o.items)):null;
    const color=CLIENT.branding_color||'#185fa5';
    return `
    <div class="order-card" id="oc-${o.id}">
      <div class="order-header">
        <div>
          <div class="order-num">ORD-${String(o.order_number).padStart(3,'0')}</div>
          <div class="order-customer">${o.customer_name}</div>
          <div class="order-meta">${o.customer_phone||''} · ${fmtDate(o.created_at)}</div>
          ${o.customer_address?`<div class="order-meta" style="margin-top:3px">📍 ${o.customer_address}</div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${statusBadge(o.status)}
          <div style="margin-top:4px">${payStatusBadge(o.payment_status||'Pending')}</div>
          <div style="font-size:14px;font-weight:700;margin-top:6px;color:${color}">${fmt(o.subtotal||o.unit_price)}</div>
        </div>
      </div>
      ${items?`<div class="order-items">${items.map(i=>`<div class="order-item-row"><span>${i.product_name}${i.size?' ('+i.size+')':''} ×${i.qty}</span><span>${fmt(i.line_total)}</span></div>`).join('')}</div>`:
        `<div class="order-items"><div class="order-item-row"><span>${o.product_name} ×${o.quantity}</span><span>${fmt(o.subtotal||o.unit_price)}</span></div></div>`}
      ${o.notes?`<div style="font-size:12px;color:var(--text3);margin-bottom:6px">📝 ${o.notes}</div>`:''}
      ${o.payment_method==='BankSlip'?`<div style="font-size:12px;color:var(--text2);margin-bottom:4px">🏦 Bank transfer ${o.bank_slip_url?'· <a href="'+o.bank_slip_url+'" target="_blank" style="color:'+color+'">View slip</a>':''}</div>${o.bank_slip_url?`<img src="${o.bank_slip_url}" class="slip-img">`:''}`:
        `<div style="font-size:12px;color:var(--text2)">💵 Cash on delivery</div>`}
      <div class="order-actions">
        <select onchange="updateOrderStatus('${o.id}',this.value)" style="font-size:12px;padding:5px 8px">
          ${['Pending','Preparing','Ready','Delivered','Cancelled'].map(s=>`<option${s===o.status?' selected':''}>${s}</option>`).join('')}
        </select>
        ${o.payment_method==='BankSlip'?`
          <button class="btn btn-sm btn-green" onclick="updatePayStatus('${o.id}','Verified')">✓ Verify payment</button>
          <button class="btn btn-sm btn-red" onclick="updatePayStatus('${o.id}','Rejected')">✗ Reject</button>
        `:'<button class="btn btn-sm btn-green" onclick="updatePayStatus(\''+o.id+'\',\'Verified\')">✓ Mark paid</button>'}
        <button class="reminder-btn" onclick="sendReminder('${o.id}','${o.customer_name}','${o.customer_phone}')">⏰ Remind</button>
      </div>
    </div>`;
  }).join('');
}

function filterOrders(){
  const sf=document.getElementById('status-filter').value;
  const pf=document.getElementById('pay-filter').value;
  let filtered=allOrders;
  if(sf)filtered=filtered.filter(o=>o.status===sf);
  if(pf)filtered=filtered.filter(o=>(o.payment_status||'Pending')===pf);
  document.getElementById('orders-list').innerHTML=renderOrders(filtered);
}

async function updateOrderStatus(id,status){
  const {error}=await sb.from('orders').update({status}).eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  const o=allOrders.find(x=>x.id===id);if(o)o.status=status;
  toast('Order → '+status);
  filterOrders();
}

async function updatePayStatus(id,payment_status){
  const {error}=await sb.from('orders').update({payment_status}).eq('id',id);
  if(error){toast('Error: '+error.message);return;}
  const o=allOrders.find(x=>x.id===id);if(o)o.payment_status=payment_status;
  toast('Payment → '+payment_status);
  filterOrders();
}

function sendReminder(orderId,name,phone){
  const msg=`Hi ${name}! Your order from ${CLIENT.name} is ready. Please confirm your delivery details. Thank you! 🙏`;
  const whatsapp=`https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`;
  window.open(whatsapp,'_blank');
  sb.from('orders').update({reminder_sent:true}).eq('id',orderId);
  toast('Reminder sent via WhatsApp');
}

function showErr(msg){document.getElementById('main').innerHTML=`<div style="text-align:center;padding:60px;color:var(--text3)"><div style="font-size:36px;margin-bottom:12px">⚠️</div><div>${msg}</div></div>`;}
init();
</script>
</body>
</html>
